# Runs the whole Kashif system with: docker compose up --build
services:
  backend:
    build: ./backend
    container_name: kashif-backend
    ports:
      - "8000:8000"            # host:container
    volumes:
      - ./backend:/app         # live code changes without rebuilding
    environment:
      - FRONTEND_ORIGIN=http://localhost:5173   # used later for CORS

  frontend:
    build: ./frontend
    container_name: kashif-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules      # keep the container's node_modules
    environment:
      - VITE_API_URL=http://localhost:8000      # the browser calls the API here
    depends_on:
      - backend